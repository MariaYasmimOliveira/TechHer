<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolios | TechHer</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <header class="flex justify-between items-center p-2 bg-purple-300 fixed top-0 left-0 w-full shadow-lg">
        <a class="font-serif text-xl p-1 text-pink-500 font-bold" href="#home">TechHer</a>
        <section >

            <a class="p-4 text-pink-500 font-bold" href="#home">Home</a>
            <a class="p-4 text-pink-500 font-bold" href="#portfolios">Portfólios</a>
            <a class="p-4 text-pink-500 font-bold" href="#vagas">Vagas</a>
        </section>
    </header>

    <main>

        <section class="">

            <div class="flex justify-center">
                <img src="imagens/estrela.png" alt="icon de estrela" class="m-20 h-10 w-10">
            </div>
            <h1 class="font-serif text-4xl text-fuchsia-950 text-center font-bold">Vitrine de Portfólios</h1>
            <h3 class="font-sans text-2xl text-center text-fuchsia-800">Página dedicada a dar visibilidade aos portfólios de <br> mulheres incríveis na tecnologia</h3>

            <div class="flex justify-center">
                <button class="mt-10 px-10 py-3 bg-pink-700 text-pink-50 font-semibold rounded-full shadow-2xl">
                    + adicionar meu Portfólio
                </button>
            </div>

        </section>

        <section class="max-w-7xl mx-auto px-6 py-12">
        <!-- Estado de Carregamento -->
        <div id="loading" class="text-center py-20">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-berryPink border-t-transparent"></div>
            <p class="mt-4 font-medium opacity-60">A carregar talentos...</p>
        </div>

        <div id="portfolio-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 hidden">
            <!-- Os cards serão inseridos aqui pelo JavaScript -->
        </div>
        </section>

    </main>

</body>
</html>
